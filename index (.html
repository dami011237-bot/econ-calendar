<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경제 지표 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --font-head:"IBM Plex Sans KR","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --font-sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --bg:#F5F6F9;
    --surface:#FFFFFF;
    --navy:#1E2F55;        /* 메인 네이비 */
    --navy-deep:#182645;   /* 요일 헤더 */
    --ink:#243254;
    --ink-soft:#5A6880;
    --line:#D9DEE8;
    --kr-text:#2B3A55;     /* 한국 일정 */
    --kr-bar:#6B7A99;
    --kr-bg:#F7F9FC;
    --us:#157A46;          /* 미국 일정 = 초록 */
    --us-bg:#E9F6EC;
    --upd:#6A3FA0;         /* 경제 지표 업데이트 = 보라 */
    --upd-bg:#EFE7F8;
    --holiday:#C2402F;
    --holiday-bg:#FBEDEA;
    --mpc:#D6336C;         /* 한국 통화정책방향 결정회의 = 핑크 */
    --mpc-bg:#FCE3EE;
    --star:#DCA400;
    --link-red:#D63020;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--font-sans);
    background:var(--bg);
    color:var(--ink);
    font-size:16px;
    line-height:1.6;
    padding:26px 14px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  /* ── 상단 헤더 (중앙 정렬) ── */
  /* ── 상단 헤더 : 왼쪽 연도·월 / 오른쪽 타이틀+아이콘 ── */
  .head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    border-bottom:1.5px solid var(--navy);
    padding-bottom:18px;
    margin-bottom:26px;
  }
  .head-left{
    font-family:var(--font-head);
  }
  .year-label{
    font-size:clamp(22px,4vw,30px);
    font-weight:600;
    letter-spacing:.12em;
    color:#7A85A0;
    margin-bottom:2px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .month-nav button{
    appearance:none;cursor:pointer;
    width:42px;height:42px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--navy);
    font-size:19px;line-height:1;
    font-family:inherit;
    box-shadow:0 1px 3px rgba(30,47,85,.08);
    flex:none;
  }
  .month-nav button:hover{background:#EFF2F8;}
  .month-nav button:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}
  .month-label{
    font-family:var(--font-head);
    font-size:clamp(32px,6.5vw,44px);
    font-weight:700;
    letter-spacing:-.01em;
    color:var(--navy);
    white-space:nowrap;
  }
  .head-right{
    display:flex;
    align-items:center;
    gap:14px;
    margin-left:auto;
  }
  .title-block{
    font-family:var(--font-head);
    text-align:right;
  }
  .brand{
    font-size:13px;
    font-weight:500;
    color:#8B95AC;
    letter-spacing:.03em;
    margin-bottom:3px;
  }
  h1{
    font-size:clamp(19px,3.5vw,24px);
    font-weight:700;
    letter-spacing:-.01em;
    color:var(--navy);
  }
  .avatar{
    width:78px;height:78px;
    flex:none;
    border-radius:50%;
    border:3px solid var(--navy);
    overflow:hidden;
    background:#EAF0F8;
    box-shadow:0 2px 6px rgba(30,47,85,.15);
  }
  .avatar img{
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 0;
    display:block;
  }
  @media (max-width:560px){
    .head{align-items:flex-start;}
    .head-right{margin-left:auto;}
    .avatar{width:62px;height:62px;}
  }

  /* ── 월 네비게이션 ── */
  /* ── 업데이트 안내 배너 ── */
  .notice{
    display:none;
    background:#FFF6E4;
    border:1.5px solid #EED9A8;
    color:#7A5A0E;
    border-radius:12px;
    padding:16px 18px;
    font-size:17px;
    font-weight:700;
    text-align:center;
    margin:0 auto 24px;
    max-width:640px;
  }
  .notice.show{display:block;}

  /* ── 투자 명언 ── */
  .quote{
    display:none;
    margin:0 auto 30px;
    max-width:640px;
    background:var(--surface);
    border-left:5px solid var(--navy);
    border-radius:6px;
    box-shadow:0 2px 8px rgba(30,47,85,.07);
    padding:20px 26px;
    text-align:center;
  }
  .quote.show{display:block;}
  .quote p{
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    word-break:keep-all;
  }
  .quote .who{
    display:block;
    text-align:right;
    margin-top:10px;
    font-size:14.5px;
    font-weight:400;
    color:#8B95AC;
  }

  /* ── 범례 ── */
  .legend{
    font-family:var(--font-sans);
    display:flex;gap:20px;justify-content:flex-end;
    margin-bottom:10px;
    font-size:14px;font-weight:600;color:var(--ink);
    flex-wrap:wrap;
  }
  .legend span::before{
    content:"";display:inline-block;width:11px;height:11px;border-radius:3px;
    margin-right:6px;vertical-align:baseline;
  }
  .legend .l-kr::before{background:var(--kr-bar);}
  .legend .l-us::before{background:var(--us);}
  .legend .l-upd::before{background:var(--upd);}

  /* ── 캘린더 ── */
  .calendar{
    font-family:var(--font-sans);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(30,47,85,.06);
  }
  .cal-head,.cal-week{
    display:grid;
    grid-template-columns:repeat(5,1fr);
  }
  .cal-head div{
    padding:13px 4px;
    text-align:center;
    font-size:16px;
    font-weight:700;
    color:#FFFFFF;
    background:var(--navy-deep);
  }
  .cal-week + .cal-week{border-top:1px solid var(--line);}
  .cell{
    min-height:118px;
    padding:10px 8px 12px;
    border-right:1px solid var(--line);
    background:var(--surface);
    position:relative;
  }
  .cell:last-child{border-right:none;}
  .cell.empty{background:#FAFBFC;}
  .cell.today{
    outline:2px solid var(--navy);
    outline-offset:-2px;
    border-radius:2px;
  }
  .daynum{
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .daynum.holiday{color:var(--holiday);}
  .today-badge{
    font-size:11px;
    font-weight:700;
    color:#FFFFFF;
    background:var(--navy);
    border-radius:99px;
    padding:2px 8px;
    line-height:1.4;
  }
  .events{display:flex;flex-direction:column;gap:6px;}
  .ev{
    appearance:none;border:none;cursor:pointer;
    text-align:left;
    font-family:inherit;
    font-size:13.5px;
    line-height:1.45;
    font-weight:600;
    padding:6px 8px;
    border-radius:4px;
    word-break:keep-all;
    transition:filter .12s ease;
  }
  .ev:hover{filter:brightness(.95);}
  .ev:focus-visible{outline:3px solid var(--navy);outline-offset:1px;}
  .ev.kr{
    color:var(--kr-text);
    background:var(--kr-bg);
    border-left:4px solid var(--kr-bar);
  }
  .ev.us{
    color:var(--us);
    background:var(--us-bg);
    border-left:4px solid var(--us);
  }
  .ev.updated{
    color:var(--upd);
    background:var(--upd-bg);
    border-left:4px solid var(--upd);
  }
  .ev.mpc{
    color:var(--mpc);
    background:var(--mpc-bg);
    border-left:4px solid var(--mpc);
  }
  .ev.holiday{
    color:var(--holiday);
    background:var(--holiday-bg);
    border-left:4px solid var(--holiday);
    cursor:default;
    font-weight:700;
  }

  /* ── 팝업 ── */
  .overlay{
    position:fixed;inset:0;
    background:rgba(24,38,69,.55);
    display:none;
    align-items:center;justify-content:center;
    padding:16px;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    font-family:var(--font-sans);
    background:var(--surface);
    border-radius:14px;
    width:100%;max-width:470px;
    max-height:86vh;
    overflow-y:auto;
    padding:26px 24px 30px;
    position:relative;
    border-top:5px solid var(--navy);
  }
  @media (prefers-reduced-motion:no-preference){
    .overlay.show .modal{animation:pop .18s ease;}
    @keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  }
  .modal .close{
    position:absolute;top:14px;right:14px;
    appearance:none;border:none;background:#EFF1F5;cursor:pointer;
    width:38px;height:38px;border-radius:50%;
    font-size:18px;color:#5A6880;
    font-family:inherit;
  }
  .modal .close:hover{background:#E1E5EC;}
  .m-date{
    font-size:18px;font-weight:900;color:var(--navy);
    padding-bottom:12px;margin-bottom:16px;
    border-bottom:1.5px solid var(--line);
  }
  .m-name{font-size:22px;font-weight:900;letter-spacing:0;margin-bottom:14px;word-break:keep-all;color:var(--ink);}
  .m-name.us{color:var(--us);}
  .m-name.kr{color:var(--kr-text);}
  .m-name.mpc{color:var(--mpc);}
  .m-meta{
    display:flex;flex-direction:column;gap:7px;
    font-size:16px;font-weight:700;
    margin-bottom:18px;
  }
  .m-meta .stars{color:var(--star);letter-spacing:2px;font-size:17px;}

  /* 관련 콘텐츠 링크 */
  .m-link{
    display:none;
    text-align:center;
    font-size:17px;
    font-weight:900;
    color:var(--link-red);
    background:#FFF2F0;
    border:2px solid var(--link-red);
    border-radius:10px;
    padding:13px 14px;
    margin-bottom:18px;
    text-decoration:none;
    word-break:keep-all;
  }
  .m-link.show{display:block;}
  .m-link:hover{background:#FFE7E3;}

  /* 발표 결과 블록 */
  .m-result{
    display:none;
    border:2px solid var(--upd);
    border-radius:12px;
    padding:16px 14px;
    margin-bottom:22px;
    background:#FBF9FE;
  }
  .m-result.show{display:block;}
  .m-result .headline{
    font-size:16.5px;
    font-weight:900;
    color:var(--us);
    word-break:keep-all;
    margin-bottom:14px;
  }
  .m-result .headline.down{color:var(--holiday);}
  .m-result .vals{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  .m-result .val{
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:9px 4px;
    text-align:center;
    background:#FFFFFF;
  }
  .m-result .val .lab{
    display:block;font-size:13px;font-weight:700;color:#5A6880;margin-bottom:3px;
  }
  .m-result .val .num{font-size:19px;font-weight:900;}
  .m-result .val.actual{
    border-color:var(--us);
    background:#EAF6EE;
  }
  .m-result .val.actual .lab{color:var(--us);}
  .m-result .val.actual .num{color:var(--us);}
  .m-result .comment{
    background:#FFF8E1;
    border:1.5px solid #EBD48F;
    border-radius:8px;
    padding:12px 13px;
  }
  .m-result .comment .lab{
    display:block;font-size:14px;font-weight:900;color:#7A5A0E;margin-bottom:6px;
  }
  .m-result .comment p{font-size:15px;font-weight:500;word-break:keep-all;}

  .m-section-title{
    font-size:16.5px;font-weight:900;color:var(--navy);
    margin-bottom:8px;
  }
  .m-section-title::before{content:"";display:inline-block;width:5px;height:15px;background:var(--navy);border-radius:2px;margin-right:8px;vertical-align:-1px;}
  .m-desc{font-size:16px;color:var(--ink);word-break:keep-all;margin-bottom:22px;}
  .m-table{width:100%;border-collapse:collapse;font-size:15.5px;}
  .m-table th,.m-table td{
    border:1.5px solid var(--line);
    padding:10px 12px;
    text-align:center;
  }
  .m-table th{background:#EEF1F6;font-weight:700;color:var(--navy);}
  .m-note{margin-top:8px;font-size:13px;color:#5A6880;}

  @media (max-width:560px){
    .cell{min-height:100px;padding:8px 5px 10px;}
    .ev{font-size:12px;padding:5px 6px;border-left-width:3px;}
    .daynum{font-size:14px;}
    .cal-head div{font-size:14px;padding:11px 2px;}
    .month-nav{gap:20px;}
    .legend{justify-content:center;gap:14px;}
  }
</style>
</head>
<body>

    <div class="head-left">
      <p class="year-label" id="yearLabel">2026</p>
      <div class="month-nav">

/* ───────── 상태 & 렌더링 ───────── */
let year = 2026, month = 9; // month: 1~12
const DAYNAMES = ["일","월","화","수","목","금","토"];
const TODAY = new Date();

function key(){ return year + "-" + String(month).padStart(2,"0"); }

function render(){
  document.getElementById("monthLabel").textContent = month + "월 일정";
  document.getElementById("yearLabel").textContent = year;
  const data = MONTHS[key()];
  document.getElementById("notice").classList.toggle("show", !data);
  const q = document.getElementById("quote");
  if(data && data.quote){
    document.getElementById("quoteText").textContent = data.quote.text;
    document.getElementById("quoteWho").textContent = data.quote.who;
    q.classList.add("show");
  } else q.classList.remove("show");
  renderCalendar(data ? data.events : {});
}

function renderCalendar(events){
  const body = document.getElementById("calBody");
  body.innerHTML = "";
  const first = new Date(year, month-1, 1);
  const lastDate = new Date(year, month, 0).getDate();
  let cursor = new Date(first);
  const dow = (cursor.getDay()+6)%7; // 월=0
  cursor.setDate(cursor.getDate()-dow);
  const isThisMonth = TODAY.getFullYear()===year && TODAY.getMonth()===month-1;

  while(cursor <= new Date(year, month-1, lastDate)){
    const week = document.createElement("div");
    week.className = "cal-week";
    let hasDayInMonth = false; // 월~금 중 이번 달 날짜가 하나도 없는 주는 건너뜀
    for(let i=0;i<7;i++){
      if(i<=4){ // 월(0)~금(4)만 표시, 토·일 제외
        const cell = document.createElement("div");
        cell.className = "cell";
        if(cursor.getMonth() === month-1){
          hasDayInMonth = true;
          const d = cursor.getDate();
          const evs = events[d] || [];
          const isHoliday = evs.some(e=>e.holiday);
          const isToday = isThisMonth && TODAY.getDate()===d;
          if(isToday) cell.classList.add("today");
          cell.innerHTML =
            '<div class="daynum'+(isHoliday?' holiday':'')+'">'+d+
            (isToday?'<span class="today-badge">오늘</span>':'')+
            '</div>';
          const box = document.createElement("div");
          box.className = "events";
          evs.forEach(e=>{
            if(e.holiday){
              const s = document.createElement("span");
              s.className = "ev holiday";
              s.textContent = e.holiday;
              box.appendChild(s);
            } else {
              const info = INFO[e.id];
              const b = document.createElement("button");
              /* 이 날짜 일정에 result가 입력된 경우에만 보라색으로 표시 */
              b.className = "ev " + (e.result ? "updated" : info.type);
              b.textContent = e.name || info.name;
              b.addEventListener("click", ()=>openModal(e, d));
              box.appendChild(b);
            }
          });
          cell.appendChild(box);
        } else {
          cell.classList.add("empty");
        }
        week.appendChild(cell);
      }
      cursor.setDate(cursor.getDate()+1);
    }
    if(hasDayInMonth) body.appendChild(week);
  }
}

/* ───────── 팝업 ───────── */
const overlay = document.getElementById("overlay");
function openModal(ev, day){
  const info = INFO[ev.id];
  const dt = new Date(year, month-1, day);
  document.getElementById("mDate").textContent =
    month + "월 " + day + "일 " + DAYNAMES[dt.getDay()] + "요일";
  const nameEl = document.getElementById("mName");
  nameEl.textContent = ev.name || info.name;
  nameEl.className = "m-name " + info.type;
  document.getElementById("mTime").textContent = info.time;
  document.getElementById("mStars").textContent =
    "★".repeat(info.stars) + "☆".repeat(3-info.stars);
  document.getElementById("mDesc").textContent = info.desc;

  /* 관련 콘텐츠 링크 : 해당 날짜 일정에 붙은 것만 표시 */
  const linkEl = document.getElementById("mLink");
  if(ev.link){
    linkEl.textContent = ev.link.label;
    linkEl.href = ev.link.url;
    linkEl.classList.add("show");
  } else {
    linkEl.classList.remove("show");
  }

  /* 발표 결과 블록 : 해당 날짜 일정에 붙은 것만 표시 */
  const resEl = document.getElementById("mResult");
  if(ev.result){
    const r = ev.result;
    const h = document.getElementById("rHeadline");
    h.textContent = r.headline;
    h.classList.toggle("down", r.up === false);
    document.getElementById("rActual").textContent = r.actual;
    document.getElementById("rForecast").textContent = r.forecast;
    document.getElementById("rPrev").textContent = r.prev;
    document.getElementById("rComment").textContent = r.comment;
    resEl.classList.add("show");
  } else {
    resEl.classList.remove("show");
  }

  /* 비교 표 */
  const wrap = document.getElementById("mCompareWrap");
  if(info.compare){
    wrap.style.display = "block";
    const table = document.getElementById("mTable");
    table.innerHTML = "";
    info.compare.forEach((row,ri)=>{
      const tr = document.createElement("tr");
      row.forEach(cellText=>{
        const el = document.createElement(ri===0 ? "th" : "td");
        el.textContent = cellText;
        tr.appendChild(el);
      });
      table.appendChild(tr);
    });
  } else {
    wrap.style.display = "none";
  }

  overlay.classList.add("show");
  document.getElementById("closeBtn").focus();
}
function closeModal(){ overlay.classList.remove("show"); }
document.getElementById("closeBtn").addEventListener("click", closeModal);
overlay.addEventListener("click", e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

/* ───────── 월 이동 ───────── */
document.getElementById("prevBtn").addEventListener("click", ()=>{
  month--; if(month<1){month=12;year--;} render();
});
document.getElementById("nextBtn").addEventListener("click", ()=>{
  month++; if(month>12){month=1;year++;} render();
});

render();
</script>
